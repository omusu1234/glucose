<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1F2937">
    <title>Glucose PWA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Glucose AI</h1>
        </header>

        <section class="card forecast-card">
            <div class="forecast-title">2-Hour Forecast</div>
            <div class="forecast-value" id="forecast-value">
                <span>--</span>
            </div>
        </section>

        <section class="card">
            <form id="log-form">
                <div class="form-group">
                    <label for="glucose">Blood Glucose (mg/dL)</label>
                    <input type="number" id="glucose" placeholder="e.g. 105" step="0.1">
                </div>
                
                <div class="form-group">
                    <label for="carbs">Carbohydrates (g)</label>
                    <input type="number" id="carbs" placeholder="e.g. 45" step="0.1">
                </div>
                
                <div class="form-group">
                    <label for="insulin">Insulin Dose (U)</label>
                    <input type="number" id="insulin" placeholder="e.g. 4" step="0.1">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="alcohol">
                    <label for="alcohol" style="margin: 0;">Alcohol Consumed</label>
                </div>
                
                <button type="submit" class="btn">Save Log</button>
            </form>
        </section>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">Checking...</span>
            </div>
            <div id="queue-count">0 pending</div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
